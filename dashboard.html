<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Mexus Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">

  <aside class="sidebar">
    <h2>Mexus Admin</h2>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="orders.html">Orders</a>
    <a href="users.html">Users</a>
    <a href="#" id="admin-logout" style="margin-top:40px; color:#ef4444;"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
  </aside>

  <main class="content" id="dashboard-page">

    <h1 class="page-title">Dashboard</h1>

    <div class="cards" style="grid-template-columns: repeat(4, 1fr);">
      <div class="card">Total Products: <br><span id="stat-products" style="font-size:2rem; color:var(--primary);">0</span></div>
      <div class="card">Active Orders: <br><span id="stat-orders" style="font-size:2rem; color:var(--primary);">0</span></div>
      <div class="card">Total Users: <br><span id="stat-users" style="font-size:2rem; color:var(--primary);">0</span></div>
      <div class="card">Revenue: <br><span id="stat-revenue" style="font-size:2rem; color:#10b981;">$0</span></div>
    </div>

    <input type="text" id="dash-search" class="search" placeholder="Search orders..." style="margin-bottom: 20px;">

    <h2 style="margin-bottom: 15px;">Recent Orders</h2>
    <table class="table">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="recent-orders-body">
        <!-- Injected via script.js -->
      </tbody>
    </table>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
